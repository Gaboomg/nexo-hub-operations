<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://gpzqlcehqrokapezasff.supabase.co; frame-ancestors 'none'; form-action 'none'"
    />
    <title>Conectando… · NEXO</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0a0a0c;
        color: #f2f2ed;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: radial-gradient(ellipse at 50% 38%, rgba(204,255,0,.09), transparent 42%), #0a0a0c;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid rgba(204,255,0,.17);
        border-radius: 22px;
        background: rgba(18,20,26,.86);
        text-align: center;
      }
      .mark { color: #ccff00; font-size: 12px; font-weight: 800; letter-spacing: .2em; }
      h1 { margin: 22px 0 8px; font-size: clamp(24px,7vw,32px); letter-spacing: -.045em; }
      p { margin: 0; color: #9da398; font-size: 14px; line-height: 1.6; }
      .pulse { width: 8px; height: 8px; margin: 24px auto 0; border-radius: 50%; background: #ccff00; box-shadow: 0 0 18px #ccff00; animation: breathe 1.1s ease-in-out infinite alternate; }
      @keyframes breathe { to { opacity: .35; transform: scale(.72); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
    <script src="./redirect.js" defer></script>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark">NEXO</div>
      <h1 id="redirect-title">Conectando contigo</h1>
      <p id="redirect-message">Estamos abriendo el enlace solicitado.</p>
      <div class="pulse" aria-hidden="true"></div>
    </main>
  </body>
</html>
